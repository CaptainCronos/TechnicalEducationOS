name: Documentation issue
description: Report inaccurate, incomplete, or broken documentation.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Document or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks installation or a supported workflow
        - Could cause incorrect, unsafe, or incompatible use
        - Incomplete or confusing
        - Typographical or cosmetic
    validations:
      required: true
