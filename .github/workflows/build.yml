name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Build wheel and source distribution
        run: |
          set -o pipefail
          python -m build 2>&1 | tee build.log

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Verify distribution set
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify checkout was not modified
        run: git diff --exit-code

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teos-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            build.log
          if-no-files-found: error
          retention-days: 14
