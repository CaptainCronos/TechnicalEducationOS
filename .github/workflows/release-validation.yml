name: Release Validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: Installed ${{ matrix.distribution }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        distribution: ["wheel", "sdist"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build

      - name: Build distributions
        run: python -m build

      - name: Create clean installation environment
        run: python -m venv "${{ runner.temp }}/teos-install-venv"

      - name: Install distribution
        shell: bash
        run: |
          if [[ "${{ matrix.distribution }}" == "wheel" ]]; then
            artifact=(dist/*.whl)
          else
            artifact=(dist/*.tar.gz)
          fi
          "${{ runner.temp }}/teos-install-venv/bin/python" \
            -m pip install --disable-pip-version-check "${artifact[0]}"

      - name: Verify installed package and CLI
        run: |
          "${{ runner.temp }}/teos-install-venv/bin/python" \
            scripts/verify_installed_package.py \
            --repository-root "${{ github.workspace }}"

      - name: Verify checkout was not modified
        run: git diff --exit-code
