name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    name: JSON Schema contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install editable package and quality tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate JSON Schema contracts
        run: python scripts/validate_schemas.py

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

      - name: Verify editable CLI
        run: |
          teos --version
          teos --help
          teos build --course curriculum/courses/dsl204

      - name: Verify checkout was not modified
        run: git diff --exit-code
