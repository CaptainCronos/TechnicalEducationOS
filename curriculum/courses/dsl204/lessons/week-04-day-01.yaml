instructor_guidance:
  - id: guidance.evidence-before-conclusion
    category: content_emphasis
    guidance: >-
      Require learners to state the observation or measurement before naming a
      repair. The lesson is about an evidence-based decision, not parts
      replacement by assumption.
    activity_ids:
      - activity.activate-prior-knowledge
      - activity.preliminary-inspection-concepts
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_source_confirmation

  - id: guidance.vehicle-specific-information
    category: shop_tip
    guidance: >-
      Verify that every team is using information for the actual axle and brake
      assembly. A generic limit or procedure must not override the applicable
      manufacturer specification.
    activity_ids:
      - activity.service-preparation
      - activity.instructor-demonstration
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
    origin:
      classification: author_decision
      source_refs:
        - source.oem-service-information
      verification: requires_curriculum_review

  - id: guidance.stop-work
    category: misconception
    guidance: >-
      Learners may interpret a visible defect as permission to continue
      disassembly. Reinforce that a finding can instead trigger a stop-work and
      instructor-review condition.
    activity_ids:
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_curriculum_review

  - id: guidance.flex
    category: flex
    guidance: >-
      If practical access is delayed, use removed training components to
      rehearse condition description and service-limit lookup. Do not treat the
      substitute activity as evidence of vehicle-service competency.
    activity_ids:
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
      verification: requires_curriculum_review

