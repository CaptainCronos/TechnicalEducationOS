terminology:
  - id: term.foundation-brake
    term: foundation brake
    definition: >-
      The wheel-end mechanical assembly that converts actuator force into
      friction to slow or stop the vehicle.
    aliases: []
    origin:
      classification: author_decision
      source_refs:
        - source.dsl204-framework
      verification: requires_source_confirmation

  - id: term.brake-drum
    term: brake drum
    definition: >-
      A rotating friction member contacted by the brake linings in a drum-brake
      assembly.
    aliases:
      - drum
    origin:
      classification: author_decision
      source_refs:
        - source.hendrickson-l974
      verification: requires_source_confirmation

  - id: term.brake-shoe
    term: brake shoe
    definition: >-
      A curved support carrying friction lining that is forced against the
      inside of a brake drum.
    aliases:
      - shoe
    origin:
      classification: author_decision
      source_refs:
        - source.hendrickson-l974
      verification: requires_source_confirmation

  - id: term.brake-lining
    term: brake lining
    definition: Friction material attached to a brake shoe.
    aliases:
      - lining
    origin:
      classification: author_decision
      source_refs:
        - source.hendrickson-l974
      verification: requires_source_confirmation

  - id: term.service-limit
    term: service limit
    definition: >-
      A manufacturer-defined dimensional or condition threshold used to decide
      whether a component may remain in service.
    aliases: []
    origin:
      classification: author_decision
      source_refs:
        - source.oem-service-information
      verification: requires_curriculum_review

  - id: term.needed-action
    term: needed action
    definition: >-
      The supported decision to continue inspection, adjust, repair, replace,
      or return a component to service.
    aliases: []
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_source_confirmation

safety_requirements:
  - id: safety.vehicle-movement
    hazard: Unexpected vehicle movement
    control: >-
      Park on the approved surface, follow the instructor's immobilization
      procedure, and chock the vehicle before inspection or service.
    severity: danger
    activity_ids:
      - activity.instructor-demonstration
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
      - activity.restore-and-close
    material_ids:
      - material.wheel-chocks
    verification: Instructor verifies immobilization before work begins.
    origin:
      classification: source_derived
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: verified

  - id: safety.stored-energy
    hazard: Stored pneumatic or spring energy in the brake system
    control: >-
      Follow vehicle-specific isolation and stored-energy procedures before
      disturbing any brake component. Do not disassemble a spring-brake
      chamber during this lesson.
    severity: danger
    activity_ids:
      - activity.instructor-demonstration
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
    material_ids: []
    prerequisite: Instructor authorization and current manufacturer procedure.
    verification: Instructor confirms the system is in the required safe state.
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3c001
        - source.oem-service-information
      verification: requires_curriculum_review

  - id: safety.lifting
    hazard: Vehicle fall or crushing while raised
    control: >-
      Use only approved, correctly rated lifting and support equipment in
      accordance with its manufacturer procedure and instructor direction.
    severity: danger
    activity_ids:
      - activity.instructor-demonstration
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
    material_ids:
      - material.lifting-equipment
    prerequisite: Instructor permission and demonstrated lifting competency.
    verification: Instructor verifies support points and stability before access.
    origin:
      classification: source_derived
      source_refs:
        - source.cdx-mht3c001
      verification: verified

  - id: safety.brake-dust
    hazard: Exposure to hazardous brake dust
    control: >-
      Use the approved brake-dust control method, required PPE, ventilation,
      and waste-handling procedure. Do not disperse dust with compressed air.
    severity: warning
    activity_ids:
      - activity.instructor-demonstration
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
      - activity.restore-and-close
    material_ids:
      - material.dust-control
      - material.eye-protection
      - material.hand-protection
    prerequisite: Instructor identifies the approved exposure-control procedure.
    verification: Instructor observes dust-control practice.
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_curriculum_review

  - id: safety.ppe-and-tools
    hazard: Eye, hand, or impact injury during inspection and service
    control: >-
      Wear task-appropriate PPE and use tools only for their intended purpose
      and in serviceable condition.
    severity: warning
    activity_ids:
      - activity.instructor-demonstration
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
      - activity.restore-and-close
    material_ids:
      - material.eye-protection
      - material.hand-protection
      - material.hand-tools
      - material.measurement-tools
    verification: Instructor observes PPE and tool use.
    origin:
      classification: source_derived
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: verified

activities:
  - id: activity.activate-prior-knowledge
    sequence: 1
    title: Brake-condition evidence warm-up
    environment: classroom
    method: warm_up
    description: >-
      Learners distinguish observations from repair conclusions using examples
      of visible drum-brake conditions.
    duration_minutes: 15
    objective_ids:
      - objective.preliminary-inspection
      - objective.document-needed-action
    material_ids: []
    resource_ids: []
    terminology_ids:
      - term.needed-action
    safety_requirement_ids: []
    instructor_actions:
      - Present two or three condition observations without supplying a diagnosis.
      - Ask which additional evidence is needed before recommending service.
    learner_actions:
      - Separate observed facts from assumptions.
      - Identify information needed to support a needed-action decision.
    outputs:
      - List of evidence needed before a service decision
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
      verification: requires_source_confirmation

  - id: activity.service-preparation
    sequence: 2
    title: Plan a safe foundation-brake service
    environment: classroom
    method: guided_discussion
    description: >-
      Learners develop the preparation sequence for the selected vehicle,
      workspace, information, tools, PPE, and hazard controls.
    duration_minutes: 45
    objective_ids:
      - objective.prepare-service
    material_ids:
      - material.lab-vehicle
      - material.wheel-chocks
      - material.lifting-equipment
      - material.hand-tools
      - material.measurement-tools
      - material.dust-control
      - material.eye-protection
      - material.hand-protection
    resource_ids:
      - resource.oem-service-information
      - resource.preliminary-inspection-task
    terminology_ids:
      - term.foundation-brake
    safety_requirement_ids:
      - safety.vehicle-movement
      - safety.stored-energy
      - safety.lifting
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Model how to locate warnings and prerequisites in service information.
      - Confirm which shop procedures require direct instructor authorization.
    learner_actions:
      - Build an ordered preparation checklist for the selected vehicle.
      - Identify each hazard control and its verification point.
    outputs:
      - Vehicle-specific service preparation checklist
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
        - source.oem-service-information
      verification: requires_source_confirmation

  - id: activity.preliminary-inspection-concepts
    sequence: 3
    title: Preliminary inspection and service limits
    environment: classroom
    method: direct_instruction
    description: >-
      Learners connect observable drum-and-shoe conditions, required
      measurements, manufacturer service limits, and possible needed actions.
    duration_minutes: 45
    objective_ids:
      - objective.preliminary-inspection
      - objective.inspect-drum-shoes
      - objective.document-needed-action
    material_ids:
      - material.measurement-tools
      - material.inspection-record
    resource_ids:
      - resource.oem-service-information
      - resource.drum-brake-maintenance
    terminology_ids:
      - term.brake-drum
      - term.brake-shoe
      - term.brake-lining
      - term.service-limit
      - term.needed-action
    safety_requirement_ids:
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Explain the difference between condition checks and dimensional checks.
      - Demonstrate how a service limit supports a needed-action decision.
    learner_actions:
      - Match inspection evidence to the applicable service-information location.
      - Explain why a visible condition may require a measurement before a decision.
    outputs:
      - Evidence-to-service-limit mapping
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
        - source.hendrickson-l974
        - source.oem-service-information
      verification: requires_source_confirmation

  - id: activity.shop-briefing
    sequence: 4
    title: Shop task briefing and readiness check
    environment: classroom
    method: assessment
    description: >-
      Each team explains its safe-state, inspection, measurement, and
      documentation plan before entering the practical phase.
    duration_minutes: 15
    objective_ids:
      - objective.prepare-service
      - objective.preliminary-inspection
    material_ids:
      - material.inspection-record
    resource_ids:
      - resource.oem-service-information
    terminology_ids:
      - term.service-limit
      - term.needed-action
    safety_requirement_ids:
      - safety.vehicle-movement
      - safety.stored-energy
      - safety.lifting
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Approve, redirect, or stop each team based on its readiness explanation.
    learner_actions:
      - State the work sequence, hazards, controls, and stop-work conditions.
    outputs:
      - Instructor authorization to begin or a corrective preparation action
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_source_confirmation

  - id: activity.instructor-demonstration
    sequence: 5
    title: Demonstrate safe access and preliminary inspection
    environment: shop
    method: demonstration
    description: >-
      The instructor demonstrates the approved safe-state verification,
      access sequence, dust control, systematic visual inspection, and
      evidence recording process on the selected assembly.
    duration_minutes: 25
    objective_ids:
      - objective.prepare-service
      - objective.preliminary-inspection
      - objective.document-needed-action
    material_ids:
      - material.lab-vehicle
      - material.wheel-chocks
      - material.lifting-equipment
      - material.hand-tools
      - material.dust-control
      - material.eye-protection
      - material.hand-protection
      - material.inspection-record
    resource_ids:
      - resource.oem-service-information
    terminology_ids:
      - term.foundation-brake
      - term.needed-action
    safety_requirement_ids:
      - safety.vehicle-movement
      - safety.stored-energy
      - safety.lifting
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Demonstrate only the vehicle-specific procedure approved for this session.
      - Narrate decision points and stop-work conditions.
    learner_actions:
      - Observe and record the sequence and verification points.
      - Ask questions before beginning team practice.
    procedure_steps:
      - Confirm authorization, vehicle identity, and applicable service information.
      - Verify vehicle immobilization and the required brake-system safe state.
      - Establish approved access and brake-dust controls.
      - Perform an outside-to-inside visual inspection.
      - Record observations without converting them prematurely into conclusions.
    outputs:
      - Demonstration observation record
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
        - source.oem-service-information
      verification: requires_source_confirmation

  - id: activity.preliminary-inspection
    sequence: 6
    title: Team preliminary foundation-brake inspection
    environment: shop
    method: guided_practice
    description: >-
      Teams establish the approved safe state, inspect the assembly
      systematically, and document conditions requiring measurement or
      instructor review.
    duration_minutes: 50
    objective_ids:
      - objective.prepare-service
      - objective.preliminary-inspection
      - objective.document-needed-action
    material_ids:
      - material.lab-vehicle
      - material.wheel-chocks
      - material.lifting-equipment
      - material.hand-tools
      - material.dust-control
      - material.eye-protection
      - material.hand-protection
      - material.inspection-record
    resource_ids:
      - resource.oem-service-information
      - resource.preliminary-inspection-task
    terminology_ids:
      - term.foundation-brake
      - term.brake-drum
      - term.brake-shoe
      - term.brake-lining
      - term.needed-action
    safety_requirement_ids:
      - safety.vehicle-movement
      - safety.stored-energy
      - safety.lifting
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Observe safe-state verification and stop unsafe work immediately.
      - Question learners about evidence and next inspection steps.
    learner_actions:
      - Complete the approved preparation sequence.
      - Inspect accessible foundation-brake components systematically.
      - Record observations and flag conditions requiring measurement.
    procedure_steps:
      - Verify the correct vehicle and service information.
      - Complete and verify all required hazard controls.
      - Inspect the assembly for condition, security, contamination, and damage.
      - Identify evidence that requires a dimensional check or further service.
      - Review preliminary findings with the instructor.
    outputs:
      - Completed preliminary inspection observations
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_source_confirmation

  - id: activity.drum-shoe-inspection
    sequence: 7
    title: Drum and shoe inspection and needed-action decision
    environment: shop
    method: guided_practice
    description: >-
      Under instructor direction, teams inspect and measure drum-and-shoe
      components within the approved lesson scope and support a needed-action
      decision with manufacturer criteria.
    duration_minutes: 30
    objective_ids:
      - objective.inspect-drum-shoes
      - objective.document-needed-action
    material_ids:
      - material.lab-vehicle
      - material.hand-tools
      - material.measurement-tools
      - material.dust-control
      - material.eye-protection
      - material.hand-protection
      - material.inspection-record
    resource_ids:
      - resource.oem-service-information
      - resource.drum-brake-maintenance
    terminology_ids:
      - term.brake-drum
      - term.brake-shoe
      - term.brake-lining
      - term.service-limit
      - term.needed-action
    safety_requirement_ids:
      - safety.stored-energy
      - safety.lifting
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Authorize each procedure step within the selected assembly's service scope.
      - Verify measurement technique and interpretation of service limits.
    learner_actions:
      - Inspect drum friction surface and shoe or lining condition.
      - Perform only instructor-authorized measurements.
      - Compare evidence with current manufacturer criteria.
      - Record and explain the needed-action decision.
    procedure_steps:
      - Confirm the authorized inspection and measurement scope.
      - Inspect drum condition and record applicable measurements.
      - Inspect shoe, lining, and accessible hardware condition.
      - Compare observations and measurements with service limits.
      - Determine and document needed action; do not install parts unless directed.
    outputs:
      - Drum-and-shoe inspection evidence
      - Manufacturer-criteria-based needed-action decision
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
        - source.hendrickson-l974
        - source.oem-service-information
      verification: requires_source_confirmation

  - id: activity.restore-and-close
    sequence: 8
    title: Restore, clean, and explain findings
    environment: shop
    method: closure
    description: >-
      Teams return the vehicle and workspace to the instructor-approved
      condition, account for tools and waste, and explain their evidence and
      needed-action decision.
    duration_minutes: 15
    objective_ids:
      - objective.prepare-service
      - objective.document-needed-action
    material_ids:
      - material.lab-vehicle
      - material.hand-tools
      - material.measurement-tools
      - material.dust-control
      - material.inspection-record
    resource_ids:
      - resource.oem-service-information
    terminology_ids:
      - term.service-limit
      - term.needed-action
    safety_requirement_ids:
      - safety.vehicle-movement
      - safety.brake-dust
      - safety.ppe-and-tools
    instructor_actions:
      - Verify vehicle, tool, waste, and workspace disposition.
      - Ask each learner to connect one observation to a supported decision.
    learner_actions:
      - Restore the vehicle and work area as directed.
      - Submit the inspection record.
      - Explain one evidence-to-decision trace.
    procedure_steps:
      - Return the vehicle to the instructor-approved condition.
      - Account for and return tools and equipment.
      - Dispose of controlled waste using the approved process.
      - Leave the workspace clean and orderly.
      - Discuss findings and needed action with the instructor.
    outputs:
      - Restored work area and vehicle
      - Submitted inspection record
      - Individual evidence-to-decision explanation
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_source_confirmation

assessments:
  - id: assessment.readiness-check
    title: Shop readiness check
    assessment_type: formative
    purpose: >-
      Determine whether each team can begin practical work safely and with an
      appropriate inspection plan.
    objective_ids:
      - objective.prepare-service
      - objective.preliminary-inspection
    activity_ids:
      - activity.shop-briefing
    evidence:
      - Team explanation of work sequence, hazards, controls, and stop-work conditions
      - Correct selection of current service information and required equipment
    criteria:
      - id: criterion.readiness.sequence
        statement: The team states a logical vehicle-specific work sequence.
        required: true
      - id: criterion.readiness.safety
        statement: The team identifies all applicable hazards and controls.
        required: true
      - id: criterion.readiness.resources
        statement: The team has the required service information, tools, and PPE.
        required: true
    feedback: Immediate instructor authorization, redirection, or stop-work instruction.
    security: instructor
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      verification: requires_source_confirmation

  - id: assessment.practical-observation
    title: Foundation-brake practical observation
    assessment_type: formative
    purpose: >-
      Evaluate safe work, systematic inspection, measurement practice,
      documentation, and use of manufacturer criteria.
    objective_ids:
      - objective.prepare-service
      - objective.preliminary-inspection
      - objective.inspect-drum-shoes
      - objective.document-needed-action
    activity_ids:
      - activity.preliminary-inspection
      - activity.drum-shoe-inspection
      - activity.restore-and-close
    evidence:
      - Instructor observation of practical work
      - Completed inspection record
      - Recorded observations and measurements
      - Supported needed-action decision
    criteria:
      - id: criterion.practical.safety
        statement: Applies all required safety controls without bypassing a stop-work condition.
        required: true
      - id: criterion.practical.information
        statement: Uses service information applicable to the selected vehicle and assembly.
        required: true
      - id: criterion.practical.inspection
        statement: Performs the authorized inspection systematically and records evidence accurately.
        required: true
      - id: criterion.practical.measurement
        statement: Uses the authorized measurement tool correctly and interprets the applicable limit.
        required: true
      - id: criterion.practical.decision
        statement: Supports the needed-action decision with recorded evidence and manufacturer criteria.
        required: true
      - id: criterion.practical.stewardship
        statement: Restores the vehicle, tools, and workspace to the required condition.
        required: true
    feedback: >-
      Instructor provides immediate safety feedback and records targeted
      coaching for any criterion not yet demonstrated.
    security: instructor
    origin:
      classification: author_decision
      source_refs:
        - source.cdx-mht3a002
        - source.cdx-mht3c001
        - source.oem-service-information
      verification: requires_source_confirmation

  - id: assessment.exit-explanation
    title: Evidence-to-decision exit explanation
    assessment_type: formative
    purpose: >-
      Confirm that each learner can explain how inspection evidence and a
      service limit support a safe needed-action decision.
    objective_ids:
      - objective.preliminary-inspection
      - objective.inspect-drum-shoes
      - objective.document-needed-action
    activity_ids:
      - activity.restore-and-close
    evidence:
      - Individual oral or written evidence-to-decision explanation
    criteria:
      - id: criterion.exit.evidence
        statement: Names a specific observation or measurement from the practical work.
        required: true
      - id: criterion.exit.limit
        statement: Identifies the applicable manufacturer criterion or required next check.
        required: true
      - id: criterion.exit.action
        statement: States a needed action consistent with the cited evidence.
        required: true
    feedback: Brief instructor correction before dismissal or assigned remediation.
    security: student
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
        - source.oem-service-information
      verification: requires_source_confirmation

