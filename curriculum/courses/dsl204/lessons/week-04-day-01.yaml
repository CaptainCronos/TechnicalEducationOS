    source_type: manufacturer_reference
    version: vehicle-specific
    availability: restricted
    notes: >-
      The instructor must select the current service procedure and
      specifications that match the vehicle and installed foundation brake.

scheduling:
  sequence: 7
  duration_minutes: 240
  source_aliases:
    - scheme: source-week-day
      value: Week 4 Day 1
  segments:
    - id: segment.classroom
      title: Foundation-brake preparation and inspection concepts
      duration_minutes: 120
      activity_ids:
        - activity.activate-prior-knowledge
        - activity.service-preparation
        - activity.preliminary-inspection-concepts
        - activity.shop-briefing
    - id: segment.shop
      title: Preliminary inspection and drum/shoe service practice
      duration_minutes: 120
      activity_ids:
        - activity.instructor-demonstration
        - activity.preliminary-inspection
        - activity.drum-shoe-inspection
        - activity.restore-and-close
  origin:
    classification: author_decision
    source_refs:
      - source.assignment-brief
      - source.dsl204-framework
    rationale: >-
      Sequence 7 assumes two instructional meetings in each of the first three
      source weeks. The 240-minute duration and segment allocation are a
      validation design pending comparison with the approved lesson.
    verification: requires_source_confirmation

