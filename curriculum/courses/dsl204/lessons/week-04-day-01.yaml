schema_version: "1.0"

lesson:
  id: lesson.dsl204.foundation-brake-preparation
  course_id: dsl204
  title: >-
    Foundation Brake Preparation, Preliminary Inspection, and Drum/Shoe
    Service
  summary: >-
    Learners prepare a vehicle and work area for foundation-brake service,
    perform a preliminary inspection, inspect drum-and-shoe components, record
    findings, and determine needed action using approved service information.
  language: en-US
  lifecycle:
    status: in_review
    version: 0.1.0
    last_reviewed: "2026-07-28"
    authors:
      - Technical Education OS curriculum team
    reviewers: []
    approved_by: []
    change_summary: >-
      Initial canonical representation. Detailed lesson content requires
      comparison with the approved lesson source before approval.

sources:
  - id: source.assignment-brief
    title: Canonical Lesson Model Design and Validation brief
    source_type: instructor_input
    version: "2026-07-28"
    availability: available
    notes: >-
      Establishes the course, source week/day label, lesson title, required
      model sections, and renderer-independence requirement.

  - id: source.approved-lesson
    title: Approved DSL204 Week 4 Day 1 lesson
    source_type: approved_lesson
    version: unknown
    availability: not_available
    notes: >-
      The named approved source was not present in the repository or connected
      DSL204 source folder during this review. Fidelity must be confirmed
      before this record can become approved.

  - id: source.dsl204-framework
    title: DSL204 Diesel Brakes Curriculum Framework
    source_type: course_framework
    version: draft-2026-06-09
    locator: >-
      /J-Tech Classes/DSL 204 Brakes/DSL204_Curriculum_Framework_Draft.docx
    availability: available
    notes: >-
      Maps Week 4 to Chapter 36, Foundation and Parking Brake Systems.

  - id: source.cdx-mht3a002
    title: CDX Tasksheet MHT3A002
    source_type: task_sheet
    version: "2021"
    locator: >-
      /J-Tech Classes/DSL 204 Brakes/Task Sheets/TS_MHT3A002.pdf
    availability: available
    notes: >-
      Supports workspace preparation, use of manufacturer information,
      preliminary brake-system identification, general shop safety, cleanup,
      and discussion of findings.

  - id: source.cdx-mht3c001
    title: CDX Tasksheet MHT3C001
    source_type: task_sheet
    version: "2021"
    locator: >-
      /J-Tech Classes/DSL 204 Brakes/Task Sheets/TS_MHT3C001.pdf
    availability: available
