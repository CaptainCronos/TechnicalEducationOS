essential_questions:
  - id: question.safe-service-decision
    prompt: >-
      How do preparation and preliminary inspection affect both technician
      safety and the accuracy of a drum-brake service decision?
    objective_ids:
      - objective.prepare-service
      - objective.preliminary-inspection
      - objective.inspect-drum-shoes
      - objective.document-needed-action
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      rationale: >-
        Synthesizes the named lesson scope into one question without copying an
        unverified question from the unavailable approved lesson.
      verification: requires_source_confirmation

