      - standard.ase-foundation-brakes
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
        - source.cdx-mht3a002
        - source.cdx-mht3c001
      rationale: Derived from the approved title and supporting task-sheet practices.
      verification: requires_source_confirmation

  - id: objective.preliminary-inspection
    statement: >-
      Perform a preliminary visual inspection of the foundation-brake assembly
      and identify conditions requiring further measurement or service.
    domain: integrated
    standard_ids:
      - standard.cdx.chapter-36
      - standard.ase-foundation-brakes
    origin:
      classification: author_decision
      source_refs:
        - source.assignment-brief
