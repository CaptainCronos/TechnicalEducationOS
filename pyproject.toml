[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "technicaleducationos"
version = "0.1.0"
description = "A curriculum compiler for technical education."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Captain Cronos" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
teos = "teos.cli:main"

[tool.setuptools.packages.find]
include = ["teos*"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["teos"]

[tool.coverage.report]
show_missing = true
skip_covered = false
